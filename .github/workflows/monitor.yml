name: 上井草グリーンハイツ 物件監視

on:
  schedule:
    # 日本時間 7:00〜23:00 の間、2時間ごとに実行（UTC基準）
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '0 0 * * *'    # JST 9:00
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '0 4 * * *'    # JST 13:00
    - cron: '0 6 * * *'    # JST 15:00
    - cron: '0 8 * * *'    # JST 17:00
    - cron: '0 10 * * *'   # JST 19:00
    - cron: '0 12 * * *'   # JST 21:00
    - cron: '0 14 * * *'   # JST 23:00
  workflow_dispatch:         # 手動実行ボタンも有効化

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # seen_listings.json をリポジトリに保存するため

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_listings.json
          git diff --staged --quiet && echo "変更なし" || git commit -m "chore: update seen listings"
          git push origin HEAD
